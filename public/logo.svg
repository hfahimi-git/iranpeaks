<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="iranpeaks.ir">
  <title>iranpeaks.ir</title>
  <!-- نشان iranpeaks: نقشه‌ی ایران درون نشانه‌ی موقعیت + قله + خط مسیر صعود -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <clipPath id="pin">
      <!-- بدنه‌ی نشانه‌ی موقعیت (map-pin) -->
      <path d="M32 3c9.9 0 18 8 18 18 0 12.8-18 40-18 40S14 33.8 14 21C14 11 22.1 3 32 3z" />
    </clipPath>
  </defs>

  <!-- بدنه‌ی نشانه‌ی موقعیت با گرادیان برند -->
  <path
    d="M32 3c9.9 0 18 8 18 18 0 12.8-18 40-18 40S14 33.8 14 21C14 11 22.1 3 32 3z"
    fill="url(#g)"
  />

  <g clip-path="url(#pin)">
    <!-- خورشید/افق -->
    <circle cx="43.5" cy="15" r="3.2" fill="#ffffff" opacity="0.9" />

    <!-- خط دور ایران (ساده‌شده، فقط برای اشاره‌ی تصویری) -->
    <path
      d="M25.5 8.5l4.6 1.1 3.1 2.4 4.4.4 3.4 2.6 3.6.9 .6 2.6-1.7 1.6-1.3 3.8 1.4 2.8-1.1 3.2-2.6 2-.7 3-2.5 2.2-3.2-2.4h-3l-2.7-2.9-3.8-.9-2.6-3.1.7-3.1-1.8-2.6 1.9-2.6-1-2.9 2.4-2.2z"
      fill="#ffffff"
      opacity="0.24"
      stroke="#ffffff"
      stroke-width="0.9"
      stroke-linejoin="round"
      stroke-opacity="0.55"
    />

    <!-- قله‌ی اصلی + خط‌الرأس -->
    <path d="M6 40l11-14 7 8 11-18 21 24v20H6z" fill="#ffffff" opacity="0.96" />
    <!-- سایه‌ی دامنه برای عمق -->
    <path d="M17 26l7 8-7 6-8-6z" fill="#1e3a8a" opacity="0.16" />
    <path d="M35 16l21 24h-9z" fill="#1e3a8a" opacity="0.1" />
    <!-- کلاهک برفی قله‌ی اصلی -->
    <path d="M35 16l5.9 6.8-3.4-.9-2.1 2.3-2.5-2.5-2.9 1.3z" fill="#dbeafe" />
  </g>

  <!-- خط مسیر (track) صعود با نقطه‌ی شروع -->
  <path
    d="M22 47c6.5-2.4 12-4.9 17.5-7.7"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-dasharray="0.01 6.5"
  />
</svg>
