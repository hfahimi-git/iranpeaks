name: Deploy to GitHub Pages

on:
  push:
    branches: [main]      # اگر شاخه‌ات master است، اینجا عوض کن
  workflow_dispatch:       # امکان اجرای دستی از تب Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22      # Vite 8 به Node 20.19+ یا 22.12+ نیاز دارد
          cache: npm

      - run: npm ci
      - run: npm run build      # همان tsc && vite build که خروجی را در dist می‌سازد

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4